# macOS app: build Cursus.app on an Intel and an Apple Silicon runner with
# macos/build.sh (which also self-tests libsimplex), upload a zipped app.
#
# Build modern macOS chrome on Intel and Apple Silicon, then compile the
# fallback UI without modern SDK flags. The minimum runtime remains macOS 12.
name: macOS

on:
  push:
    branches: [main, master, "feature/macos"]
    paths: ["macos/**", "bridge/**", "core/**", "call/**", "Cargo.toml", "Cargo.lock", ".cargo/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "bridge/**", "core/**", "call/**", "Cargo.toml", "Cargo.lock", ".cargo/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Cursus.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-apple-darwin, runner: macos-26-intel }
          - { arch: arm64, target: aarch64-apple-darwin, runner: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Cursus.app
        run: ./macos/build.sh
      - name: Compile fallback UI
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: swift build -c release --package-path macos/Cursus -Xlinker -L -Xlinker "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
      - name: Rust call controller and PCM tests
        run: |
          cargo test --locked -p cursus-bridge --features calls
          cargo test --locked -p cursus-call pcm
      - name: Zip
        run: ditto -c -k --keepParent macos/build/Cursus.app Cursus-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Cursus-macos-${{ matrix.arch }}
          path: Cursus-macos-${{ matrix.arch }}.zip
