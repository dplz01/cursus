[workspace]
resolver = "2"
members = [
    "call",
    "core",
    "linux",
    "bridge",
    "android/jni",
]
default-members = ["linux"]

[workspace.package]
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dplz01/cursus"
rust-version = "1.88"

[workspace.dependencies]
cursus-core = { path = "core" }
cursus-call = { path = "call" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
emojis = "0.6"
libloading = "0.8"
notify-rust = "4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26", default-features = false, features = ["serde", "ksni"] }
thiserror = "2"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

# Debug builds (`cargo run`, also how phones run Cursus from a checkout):
# dependencies are built optimized once — iced, wgpu, text shaping, image /
# audio decoding, tokio and WebRTC run several times slower unoptimized, which
# made scrolling and page slides stutter on ARM. Our own crates stay
# unoptimized with full debug info, so rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 2
# Line tables keep backtraces readable; full debug info for every dependency
# made a ~760 MB binary that took long to link on a phone.
debug = "line-tables-only"

# Backdrop blur under floating glass: iced_wgpu with a readable window
# surface (third_party/iced_wgpu/CURSUS_PATCH.md).
[patch.crates-io]
iced_wgpu = { path = "third_party/iced_wgpu" }
