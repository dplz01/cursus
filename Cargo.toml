[workspace]
resolver = "2"
members = [
    "core",
    "linux",
    "macos/bridge",
]
default-members = ["linux"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dplz01/cursus"
rust-version = "1.88"

[workspace.dependencies]
cursus-core = { path = "core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
emojis = "0.6"
libloading = "0.8"
notify-rust = "4"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26", default-features = false, features = ["serde", "ksni"] }
thiserror = "2"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
