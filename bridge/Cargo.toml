[package]
name = "cursus-bridge"
description = "JSON API over cursus-core for the native apps (macOS: C ABI, Android: JNI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "cursus_bridge"
# Static only: with a dylib next to it the linker would prefer that, and the
# app bundle would need one more library to ship and sign.
crate-type = ["staticlib", "rlib"]

[dependencies]
cursus-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
