[package]
name = "cursus-core"
description = "Shared SimpleX session and domain logic for Cursus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Load official glibc-built libsimplex on musl (Alpine / postmarketOS) via
# fcntl64/stat64 shim, LD_PRELOAD re-exec, and gcompat. Off by default.
musl-glibc-compat = ["dep:cc"]

[dependencies]
anyhow.workspace = true
directories.workspace = true
emojis.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
zeroize.workspace = true
libc = "0.2"

[build-dependencies]
cc = { version = "1", optional = true }
