[package]
name = "cursus-linux"
description = "Cursus desktop client for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cursus"
path = "src/main.rs"

[features]
default = []
# Deprecated no-op: musl builds include the glibc compat layer automatically.
musl-glibc-compat = ["cursus-core/musl-glibc-compat"]

[dependencies]
cursus-core.workspace = true
base64 = "0.22"
chrono.workspace = true
iced = { version = "0.14", features = ["tokio", "debug", "svg", "image", "canvas", "advanced", "lazy"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["context_menu"] }
libc = "0.2"
zeroize.workspace = true
# App lock: in-memory Argon2id verifier of the unlock password (never on disk).
argon2 = "0.5"
# Optional "unlock automatically": DB password in the Secret Service keyring.
oo7 = { version = "0.4", default-features = false, features = ["async-std", "native_crypto"] }
# Pure-Rust audio decode for waveforms (ffmpeg may be missing on phones).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "wav", "pcm", "mp3", "ogg", "vorbis"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
notify-rust.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
unicode-segmentation.workspace = true
# Fallback trait signature (same version cosmic-text uses).
unicode-script = "0.5"
# Calls: native WebRTC (no browser/WebView), Opus, SimpleX frame encryption.
webrtc = "=0.17.2"
opus = "0.3"
# Bundled libopus built statically: phones may not ship libopus.so.
audiopus_sys = { version = "0.2", features = ["static"] }
aes-gcm = "0.10"
# SimpleX signaling packs SDP / ICE as LZString.compressToBase64(JSON).
lz-str = "0.2"
# Calls: acoustic echo cancellation (pure Rust, finds the echo delay itself).
decibri-aec = "0.2"
# Keep phones awake during calls (portal / logind inhibitor). Already in the
# tree via the tray icon; no extra crates.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
emojis.workspace = true
# Headless UserInterface harness for widget tests (edit_menu).
iced_runtime = "0.14"
