[package]
name = "cursus-linux"
description = "Cursus desktop client for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cursus"
path = "src/main.rs"

[dependencies]
cursus-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
iced = { version = "0.13", features = ["tokio", "debug", "svg", "image", "canvas", "advanced"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
notify-rust.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
unicode-segmentation.workspace = true
